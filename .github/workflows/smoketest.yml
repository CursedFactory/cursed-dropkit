name: Smoketest

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  smoketest-container:
    runs-on: ubuntu-latest
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      SMOKETEST_MODEL: openrouter/x-ai/grok-4.1-fast
    steps:
      - uses: actions/checkout@v4
      - name: Skip when secret is missing
        if: ${{ env.OPENROUTER_API_KEY == '' }}
        run: |
          echo "OPENROUTER_API_KEY is not configured; skipping smoketest job."
      - name: Build smoketest container
        if: ${{ env.OPENROUTER_API_KEY != '' }}
        run: docker build -f smoketest/Dockerfile -t cursed-dropkit-smoketest:ci .
      - name: Run end-to-end smoketest
        if: ${{ env.OPENROUTER_API_KEY != '' }}
        run: |
          docker run --rm \
            -e OPENROUTER_API_KEY \
            -e SMOKETEST_MODEL \
            cursed-dropkit-smoketest:ci
