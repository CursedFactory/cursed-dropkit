name: Smoketest

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  smoketest-container:
    if: ${{ secrets.OPENROUTER_API_KEY != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build smoketest container
        run: docker build -f smoketest/Dockerfile -t cursed-dropkit-smoketest:ci .
      - name: Run end-to-end smoketest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SMOKETEST_MODEL: openrouter/x-ai/grok-4.1-fast
        run: |
          docker run --rm \
            -e OPENROUTER_API_KEY \
            -e SMOKETEST_MODEL \
            cursed-dropkit-smoketest:ci
